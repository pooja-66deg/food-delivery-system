name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ vars.CI_POSTGRES_USER || 'fooduser' }}
          POSTGRES_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'foodpass' }}
          POSTGRES_DB: ${{ vars.CI_POSTGRES_DB || 'fooddelivery' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://${{ vars.CI_POSTGRES_USER || 'fooduser' }}:${{ vars.CI_POSTGRES_PASSWORD || 'foodpass' }}@localhost:5432/${{ vars.CI_POSTGRES_DB || 'fooddelivery' }}
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ${{ vars.CI_JWT_SECRET_KEY || 'ci-secret-key' }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.3"
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --no-install-project

      - name: Lint
        run: uv run flake8 shared services

      # Every service chain round-trips against the same Postgres this job
      # already has. A chain that cannot be undone cannot be rolled back in
      # production either.
      - name: Verify service migrations
        run: |
          # Created with psycopg2 rather than psql, which is not guaranteed on
          # the runner and would fail late and confusingly if it were missing.
          uv run python - <<'PY'
          import os, psycopg2
          url = os.environ["DATABASE_URL"]
          conn = psycopg2.connect(url)
          conn.autocommit = True
          with conn.cursor() as cur:
              for svc in ("users", "restaurants", "orders", "payments",
                          "delivery", "notifications", "admin"):
                  cur.execute(f'DROP DATABASE IF EXISTS {svc}_db')
                  cur.execute(f'CREATE DATABASE {svc}_db')
          conn.close()
          PY
          for svc in users restaurants orders payments delivery notifications admin; do
            echo "== $svc"
            (
              cd services/$svc
              export DATABASE_URL="${DATABASE_URL%/*}/${svc}_db"
              uv run --project ../.. alembic upgrade head
              uv run --project ../.. alembic downgrade base
              uv run --project ../.. alembic upgrade head
            )
          done

      # The shared package — identity, messaging, the outbox, the HTTP client —
      # which every service copies into its image.
      - name: Test shared
        run: uv run pytest

      # One process per service: every service has a package named `app`, so a
      # single pytest run would import one and serve it to all of them.
      - name: Test services
        run: ./services/test.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      - name: Type-check & build
        run: npm run build

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Check deploy configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_CLOUDSQL_INSTANCE: ${{ vars.GCP_CLOUDSQL_INSTANCE }}
          GCP_VPC_CONNECTOR: ${{ vars.GCP_VPC_CONNECTOR }}
          GCP_GATEWAY_URL: ${{ vars.GCP_GATEWAY_URL }}
          GCP_FE_URL: ${{ vars.GCP_FE_URL }}
          GCP_USERS_URL: ${{ vars.GCP_USERS_URL }}
          GCP_RESTAURANTS_URL: ${{ vars.GCP_RESTAURANTS_URL }}
          GCP_ORDERS_URL: ${{ vars.GCP_ORDERS_URL }}
          GCP_PAYMENTS_URL: ${{ vars.GCP_PAYMENTS_URL }}
          GCP_DELIVERY_URL: ${{ vars.GCP_DELIVERY_URL }}
          GCP_NOTIFICATIONS_URL: ${{ vars.GCP_NOTIFICATIONS_URL }}
          GCP_ADMIN_URL: ${{ vars.GCP_ADMIN_URL }}
        run: |
          # Hard requirements: without these the deploy cannot do anything at
          # all, so failing here beats failing halfway through.
          for name in GCP_PROJECT_ID GCP_CLOUDSQL_INSTANCE GCP_VPC_CONNECTOR; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository variable: $name (Settings -> Secrets and variables -> Actions -> Variables)"
              exit 1
            fi
          done

          # Unset is a warning, not an error, and that is the whole point of the
          # two-pass bootstrap: on the first deploy these do not exist yet,
          # because this run is what creates the services that have them.
          # Requiring them here would mean the first deploy could never run.
          #
          # Set-but-malformed is different, and is an error. A value like
          # "api-gateway" — the service name rather than its URL — is not caught
          # by an emptiness check, and _GATEWAY_URL is baked into the SPA bundle
          # at build time: with no scheme the browser resolves it relative to the
          # page, so every API call went to
          # https://food-frontend.../api-gateway/auth/login and nginx answered
          # 405 for a POST to a static path. The deploy itself went green.
          malformed=0
          for name in GCP_GATEWAY_URL GCP_FE_URL GCP_USERS_URL GCP_RESTAURANTS_URL \
                      GCP_ORDERS_URL GCP_PAYMENTS_URL GCP_DELIVERY_URL \
                      GCP_NOTIFICATIONS_URL GCP_ADMIN_URL; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::warning::$name is unset — expected on the first deploy. Set it from \`gcloud run services list\` and deploy again."
              continue
            fi
            # GCP_FE_URL is legitimately a comma-separated pair: Cloud Run serves
            # each service on two hostnames and CORS matches Origin exactly, so
            # each element is checked rather than the whole string.
            IFS=',' read -ra parts <<< "$value"
            for part in "${parts[@]}"; do
              case "$part" in
                https://*.run.app|https://*.run.app/*) ;;
                https://*) echo "::warning::$name contains '$part', which is not a *.run.app URL. Intentional if you have a custom domain." ;;
                *)
                  echo "::error::$name is '$part' — expected a full https:// URL, not a service name or path. Read it with: gcloud run services describe SERVICE --region=\$REGION --format='value(status.url)'"
                  malformed=1
                  ;;
              esac
            done
            # A trailing slash concatenates into a double slash in the SPA's
            # fetch, and breaks CORS origin matching, which is byte-exact.
            case "$value" in
              */) echo "::error::$name has a trailing slash. Remove it."; malformed=1 ;;
            esac
          done
          [ "$malformed" -eq 0 ] || exit 1

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy
        run: |
          # The service URLs are what the gateway routes to and what orders
          # calls for checkout. Empty on the very first deploy — see
          # infra/gcp/README.md, "The first deploy takes two passes".
          #
          # ^@^ switches gcloud's separator between substitutions from "," to
          # "@", the same escape cloudbuild.yaml uses for --set-env-vars. It is
          # required, not stylistic: _FE_URL is a comma-separated pair, and with
          # the default separator gcloud reads that comma as the end of the
          # substitution and rejects the second URL as a malformed key=value.
          # Nothing here may contain an "@".
          SUBS="^@^_REGION=${{ vars.GCP_REGION || 'us-central1' }}"
          SUBS="$SUBS@_AR_REPO=${{ vars.GCP_AR_REPO || 'food-delivery' }}"
          SUBS="$SUBS@_CLOUDSQL_INSTANCE=${{ vars.GCP_CLOUDSQL_INSTANCE }}"
          SUBS="$SUBS@_VPC_CONNECTOR=${{ vars.GCP_VPC_CONNECTOR }}"
          SUBS="$SUBS@_GCS_BUCKET_NAME=${{ vars.GCP_GCS_BUCKET_NAME }}"
          SUBS="$SUBS@_GATEWAY_URL=${{ vars.GCP_GATEWAY_URL }}"
          SUBS="$SUBS@_FE_URL=${{ vars.GCP_FE_URL }}"
          SUBS="$SUBS@_USERS_URL=${{ vars.GCP_USERS_URL }}"
          SUBS="$SUBS@_RESTAURANTS_URL=${{ vars.GCP_RESTAURANTS_URL }}"
          SUBS="$SUBS@_ORDERS_URL=${{ vars.GCP_ORDERS_URL }}"
          SUBS="$SUBS@_PAYMENTS_URL=${{ vars.GCP_PAYMENTS_URL }}"
          SUBS="$SUBS@_DELIVERY_URL=${{ vars.GCP_DELIVERY_URL }}"
          SUBS="$SUBS@_NOTIFICATIONS_URL=${{ vars.GCP_NOTIFICATIONS_URL }}"
          SUBS="$SUBS@_ADMIN_URL=${{ vars.GCP_ADMIN_URL }}"
          SUBS="$SUBS@_MAPS_BROWSER_KEY=${{ vars.GCP_MAPS_BROWSER_KEY }}"
          SUBS="$SUBS@_STRIPE_PUBLISHABLE_KEY=${{ vars.GCP_STRIPE_PUBLISHABLE_KEY }}"
          SUBS="$SUBS@_TAG=${{ github.sha }}"
          gcloud builds submit \
            --config infra/gcp/cloudbuild.yaml \
            --substitutions="$SUBS"
