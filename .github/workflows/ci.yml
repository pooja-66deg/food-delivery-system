name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fooduser
          POSTGRES_PASSWORD: foodpass
          POSTGRES_DB: fooddelivery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fooduser -d fooddelivery"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://fooduser:foodpass@localhost:5432/fooddelivery
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (flake8)
        run: flake8 src

      - name: Verify Alembic migrations apply to a clean Postgres
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        # conftest bootstraps SQLite+fakeredis for unit tests; integration tests
        # use Testcontainers (Docker is available on the runner).
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check & build
        run: npm run build
