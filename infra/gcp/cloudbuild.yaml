# Cloud Build pipeline: test -> build -> push to Artifact Registry -> deploy to Cloud Run.
#
# Trigger:  gcloud builds submit --config infra/gcp/cloudbuild.yaml \
#             --substitutions=_REGION=us-central1,_AR_REPO=food-delivery,\
# _CLOUDSQL_INSTANCE=PROJECT:us-central1:food-db,_VPC_CONNECTOR=food-connector,\
# _API_URL=https://food-api-xxxx.run.app,_TAG=abc1234
#
# _TAG must be a real tag. See the substitution comment below: leaving it to
# Cloud Build's SHORT_SHA breaks every manual build.
#
# One-time infrastructure setup lives in infra/gcp/README.md.

substitutions:
  _REGION: us-central1
  _AR_REPO: food-delivery              # Artifact Registry repository name
  _API_SERVICE: food-api
  _FE_SERVICE: food-frontend
  _CLOUDSQL_INSTANCE: ""               # PROJECT:REGION:INSTANCE
  _VPC_CONNECTOR: ""                   # Serverless VPC Access connector (for Memorystore)
  _API_URL: ""                         # Public API URL the frontend calls (set after first API deploy or use a custom domain)
  # Public frontend URL. The API needs it for two things, and a deploy without it
  # is quietly broken rather than obviously broken:
  #   - CORS_ORIGINS — the frontend is a separate Cloud Run service on its own
  #     origin, so without it every browser request is rejected. The default
  #     allowlist is localhost, which is right for dev and useless here.
  #   - FRONTEND_BASE_URL — password-reset and email-verification links are built
  #     from it, so an unset value mails the recipient a link to their own machine.
  _FE_URL: ""
  # Browser-side Google Maps key, baked into the SPA bundle. Public by
  # construction, so it must be a referrer-restricted key with only the Maps
  # JavaScript API enabled — NOT the server key, which lives in Secret Manager
  # and carries Routes + Geocoding permission. Unset: tracking shows the ETA as
  # text with no map.
  _MAPS_BROWSER_KEY: ""
  # Stripe publishable key (pk_test_… / pk_live_…), baked into the SPA bundle.
  # Public by construction, so a substitution and not a secret — it can only
  # tokenise cards, never charge. The matching sk_… secret key goes in Secret
  # Manager. Unset: checkout shows COD only, because CartPage hides the card
  # option when no publishable key is present.
  _STRIPE_PUBLISHABLE_KEY: ""
  # Image tag. Deliberately not Cloud Build's SHORT_SHA built-in: that is only
  # populated for builds invoked by a trigger, so a manual
  # `gcloud builds submit` expanded it to "" and produced the invalid reference
  # "…/api:", which the docker CLI rejects with exit 125. Pass it explicitly —
  #   manual:  _TAG=$(git rev-parse --short HEAD)
  #   trigger: _TAG=$SHORT_SHA
  # "latest" is only the default so a bare submit works; prefer a real sha, or
  # you cannot tell which revision is running or roll back by tag.
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY

# NOTE: images are pushed by explicit steps below, not by a top-level `images:`
# block. That block only runs after every step succeeds, so the deploy steps
# would try to pull tags that do not exist in Artifact Registry yet.

steps:
  # 1. Run the test suite (uses in-memory SQLite + fakeredis, so no live infra needed).
  - id: test
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        pip install --quiet uv
        uv sync --frozen --extra dev --no-install-project
        export DATABASE_URL="postgresql://u:p@localhost:5432/db" \
               REDIS_URL="redis://localhost:6379/0" \
               JWT_SECRET_KEY="ci-secret" KAFKA_BROKERS="localhost:9092"
        uv run pytest -q

  # 2. Build + push the API image.
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/docker/Dockerfile
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api:${_TAG}"
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api:${_TAG}"

  # 3. Build + push the frontend image (API URL baked in at build time).
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/gcp/frontend.Dockerfile
      - --build-arg
      - "VITE_API_URL=${_API_URL}"
      - --build-arg
      - "VITE_GOOGLE_MAPS_API_KEY=${_MAPS_BROWSER_KEY}"
      - --build-arg
      - "VITE_STRIPE_PUBLISHABLE_KEY=${_STRIPE_PUBLISHABLE_KEY}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/frontend:${_TAG}"
      - .

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/frontend:${_TAG}"

  # 4. Deploy the API to Cloud Run (secrets + Cloud SQL + Memorystore via VPC).
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_API_SERVICE}"
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      # CORS_ORIGINS and FRONTEND_BASE_URL both come from _FE_URL — see the
      # substitution comment for why an unset value breaks the deployed app.
      # The leading ^@^ switches gcloud's key/value separator from "," to "@", so
      # _FE_URL may itself be a comma-separated list. It has to be: Cloud Run
      # serves each service on two hostnames (the legacy PROJECT-HASH-REGION
      # .a.run.app and the newer SERVICE-PROJECTNUMBER.REGION.run.app), CORS
      # matches Origin by exact string, and whichever one is missing from the
      # allowlist blocks every request made from it.
      - --set-env-vars=^@^ENVIRONMENT=production@KAFKA_BROKERS=disabled:9092@CORS_ORIGINS=${_FE_URL}@FRONTEND_BASE_URL=${_FE_URL}
      # GOOGLE_MAPS_API_KEY is a secret, not an env var: it carries Routes and
      # Geocoding permission and must never reach the browser. Without it the
      # API still serves ETAs, computed straight-line instead of via Google.
      # SENDGRID_* are what turn transactional email from log-only into real
      # delivery. Both are required together: EmailSender tests `key and sender`,
      # so mounting one without the other silently keeps the log transport.
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,SENDGRID_FROM_EMAIL=SENDGRID_FROM_EMAIL:latest
    waitFor: ["test", "push-api"]

  # 5. Deploy the frontend to Cloud Run (static SPA served by nginx).
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_FE_SERVICE}"
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/frontend:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
    waitFor: ["push-frontend"]
