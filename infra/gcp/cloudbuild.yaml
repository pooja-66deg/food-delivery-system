# Cloud Build pipeline for the split platform:
#   test -> build 9 images -> provision Pub/Sub -> migrate -> deploy
#
# Trigger:  gcloud builds submit --config infra/gcp/cloudbuild.yaml \
#             --substitutions=_REGION=us-central1,_AR_REPO=food-delivery,\
# _CLOUDSQL_INSTANCE=PROJECT:us-central1:food-db,_VPC_CONNECTOR=food-connector,\
# _TAG=abc1234
#
# One-time infrastructure setup lives in infra/gcp/README.md.
#
# ---------------------------------------------------------------------------
# Three things about this pipeline are worth knowing before changing it.
#
# **It bootstraps in two passes.** The gateway needs each service's Cloud Run
# URL, and the frontend needs the gateway's — none of which exist until the
# first deploy. So the first run leaves those substitutions empty (the gateway
# 502s, the frontend has no API), you read the URLs off the console, and the
# second run wires them. Same chicken-and-egg the single-service version had
# with _API_URL, now with eight of them.
#
# **Migrations run as Cloud Run jobs, not build steps.** A build step has no
# route to a private Cloud SQL instance without the auth proxy; a Cloud Run job
# gets the same Cloud SQL mount the service does — but note the flag is spelled
# differently on the two surfaces: `gcloud run deploy` takes
# --add-cloudsql-instances, `gcloud run jobs deploy` only takes
# --set-cloudsql-instances, and rejects the other as an unrecognized argument
# (exit 2, before any migration runs). Each service migrates its own database,
# which is the point of separate chains.
#
# **Pub/Sub replaces Kafka here.** Not managed Kafka: its fixed cluster cost is
# wrong for this volume where Pub/Sub is per-message with no floor. Services do
# not know the difference — see shared/messaging.py — so the compose stack
# keeps Kafka and developers keep needing no cloud credentials.
# ---------------------------------------------------------------------------

substitutions:
  _REGION: us-central1
  _AR_REPO: food-delivery              # Artifact Registry repository name
  _CLOUDSQL_INSTANCE: ""               # PROJECT:REGION:INSTANCE
  _VPC_CONNECTOR: ""                   # Serverless VPC Access connector (for Memorystore)
  # GCS bucket for restaurant/menu images (public; the restaurants service's
  # account needs objectCreator on it).
  _GCS_BUCKET_NAME: ""

  # Where "a restaurant is waiting for approval" is emailed. An operations
  # mailbox, not a user: the restaurants service publishing the alert has no idea
  # who the admins are, since roles live in the users service. Empty disables the
  # alert, and that is a supported state — the admin console still lists every
  # pending venue, so an unconfigured deploy is one where operators poll rather
  # than one that drops registrations.
  _ADMIN_ALERT_EMAIL: ""
  # Public URL of the API gateway — what the frontend calls. The plain origin,
  # with no /api suffix and no trailing slash: build-frontend appends /api when
  # it bakes VITE_API_URL into the bundle. Empty on the first pass; set it on
  # the second.
  _GATEWAY_URL: ""
  # Public frontend URL, and legitimately a comma-separated list — Cloud Run
  # serves each service on both a hash and a project-number hostname, and CORS
  # matches Origin byte-exactly, so a single entry locks out whichever one the
  # user actually landed on. Three uses, and a deploy without it is quietly
  # broken rather than obviously broken:
  #   - CORS_ORIGINS on *every* service — the frontend is a separate Cloud Run
  #     service on its own origin, so without it every browser request is
  #     rejected. Every service and not just users: the gateway forwards a
  #     response untouched, so each one's own headers are what the browser
  #     checks. Takes the whole list.
  #   - FRONTEND_BASE_URL on users — password-reset links are built from it, so
  #     an unset value mails the recipient a link to their own machine.
  #   - FRONTEND_BASE_URL on payments — where Stripe returns the customer.
  # Both FRONTEND_BASE_URL uses concatenate it into one link and so take the
  # first element only; see fe_primary in deploy-services.
  _FE_URL: ""

  # Internal Cloud Run URLs the gateway routes to, and that orders calls for
  # checkout. Empty on the first pass. Services are deployed with
  # --ingress=internal-and-cloud-load-balancing so only the gateway and each
  # other can reach them; the gateway itself is the public door.
  _USERS_URL: ""
  _RESTAURANTS_URL: ""
  _ORDERS_URL: ""
  _PAYMENTS_URL: ""
  _DELIVERY_URL: ""
  _NOTIFICATIONS_URL: ""
  _ADMIN_URL: ""

  # Browser-side Google Maps key, baked into the SPA bundle. Public by
  # construction, so it must be a referrer-restricted key with only the Maps
  # JavaScript API enabled — NOT the server key, which lives in Secret Manager
  # and carries Routes + Geocoding permission.
  _MAPS_BROWSER_KEY: ""
  # Stripe publishable key (pk_test_… / pk_live_…), baked into the SPA bundle.
  # Public by construction — it can only tokenise cards, never charge.
  _STRIPE_PUBLISHABLE_KEY: ""

  # Image tag. Deliberately not Cloud Build's SHORT_SHA built-in: that is only
  # populated for builds invoked by a trigger, so a manual
  # `gcloud builds submit` expanded it to "" and produced the invalid reference
  # "…/api:", which the docker CLI rejects with exit 125. Pass it explicitly —
  #   manual:  _TAG=$(git rev-parse --short HEAD)
  #   trigger: _TAG=$SHORT_SHA
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8   # nine image builds; the default is slower than the wait is worth

# NOTE: images are pushed by explicit steps below, not by a top-level `images:`
# block. That block only runs after every step succeeds, so the deploy steps
# would try to pull tags that do not exist in Artifact Registry yet.

steps:
  # -----------------------------------------------------------------------
  # 1. Tests. Both suites: the platform's, and each service's own.
  # -----------------------------------------------------------------------
  - id: test
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        pip install --quiet uv
        uv sync --frozen --extra dev --no-install-project
        export REDIS_URL="redis://localhost:6379/0" \
               JWT_SECRET_KEY="ci-secret" KAFKA_BROKERS="localhost:9092"
        # The shared package, then each service in its own process — they all
        # have a package named `app`, so one pytest run would import one and
        # serve it to all of them.
        # DATABASE_URL is intentionally unset: concurrency tests need PostgreSQL
        # (which is not available in Cloud Build) and gracefully skip when it's absent.
        uv run pytest -q
        ./services/test.sh

  # -----------------------------------------------------------------------
  # 2. Build and push every image, in parallel. Each service's Dockerfile
  #    copies the shared package plus its own app/ — never a sibling's, so an
  #    image cannot import another service even by accident.
  # -----------------------------------------------------------------------
  - id: build-services
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        for svc in users restaurants orders payments delivery notifications admin; do
          docker build -f services/$$svc/Dockerfile \
            -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/$$svc:${_TAG}" . &
        done
        wait
        for svc in users restaurants orders payments delivery notifications admin; do
          docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/$$svc:${_TAG}"
        done

  - id: build-gateway
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        docker build -f infra/gcp/gateway.Dockerfile \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/gateway:${_TAG}" .
        docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/gateway:${_TAG}"

  # VITE_API_URL is the API *base*, not the gateway origin: every route in
  # infra/nginx/nginx.conf.template lives under /api/, and the SPA's default when
  # the variable is unset is the bare string "/api" (frontend/src/api/client.ts).
  # Passing _GATEWAY_URL alone dropped the prefix, so the SPA called
  # https://api-gateway.../auth/login, nginx's catch-all `location /` returned
  # 404 with no CORS headers, and the browser reported a CORS failure rather than
  # the routing mistake it was. _GATEWAY_URL stays the plain origin so it is one
  # copy-paste from `gcloud run services describe`, and the /api is appended here.
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        docker build -f infra/gcp/frontend.Dockerfile \
          --build-arg "VITE_API_URL=${_GATEWAY_URL}/api" \
          --build-arg "VITE_GOOGLE_MAPS_API_KEY=${_MAPS_BROWSER_KEY}" \
          --build-arg "VITE_STRIPE_PUBLISHABLE_KEY=${_STRIPE_PUBLISHABLE_KEY}" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/frontend:${_TAG}" .
        docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/frontend:${_TAG}"

  # -----------------------------------------------------------------------
  # 3. Pub/Sub. Topics, and one subscription per (service, topic) — the name
  #    the consumer derives at runtime, so the two have to agree exactly.
  #    See EventConsumer._run_pubsub for the other half of this contract.
  # -----------------------------------------------------------------------
  - id: provision-pubsub
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        # Idempotent: the pipeline runs on every deploy, and ALREADY_EXISTS is
        # the expected outcome from the second run onwards.
        create_topic() {
          gcloud pubsub topics create "$$1" --quiet 2>/dev/null || true
        }
        create_sub() {
          # ack deadline: the handler timeout in EventConsumer is 30s, so a
          # shorter deadline would have Pub/Sub redeliver work still in flight.
          gcloud pubsub subscriptions create "$$1--$$2" --topic="$$2" \
            --ack-deadline=60 --message-retention-duration=7d \
            --enable-message-ordering --quiet 2>/dev/null || true
        }

        for t in order-events payment-events delivery-events address-events \
                 restaurant-events user-events user-contact-events \
                 notification-events payment-commands restaurant-registrations; do
          create_topic "$$t"
        done

        # Mirrors each service's KAFKA_TOPICS exactly. Drift here is silent: a
        # missing subscription means a consumer that starts cleanly and never
        # receives anything.
        for t in payment-events delivery-events address-events restaurant-events user-events; do
          create_sub orders-service "$$t"; done
        for t in order-events payment-commands; do
          create_sub payments-service "$$t"; done
        # user-events: the owner-name read-model behind the admin restaurant
        # list. Names only — contact details travel on the restricted topic,
        # which this service has no reason to subscribe to.
        #
        # restaurant-registrations: a new owner's venue, handed over at sign-up.
        # Its own topic rather than a field on user-events, because a street
        # address and a business phone are not something every consumer of a
        # display name should receive.
        for t in order-events user-events restaurant-registrations; do
          create_sub restaurants-service "$$t"; done
        # restaurant-events belongs here and was missing. delivery's config
        # defaults KAFKA_TOPICS to all three, so the service logged that it was
        # consuming restaurant-events at every startup while no such subscription
        # existed — and shared/messaging.py never checks the subscribe future, so
        # the NotFound was swallowed and the RestaurantSnapshot read-model simply
        # stayed empty. Exactly the silent drift the comment above warns about.
        for t in order-events user-events restaurant-events; do
          create_sub delivery-service "$$t"; done
        # restaurant-events: approval decisions, which reach the applicant by
        # email — this is the only service holding an address to send to, and
        # the owner is locked out of the app until the decision goes their way.
        for t in order-events notification-events user-contact-events restaurant-events; do
          create_sub notifications-service "$$t"; done
        # The users service consumes exactly one topic: an approval decision is
        # what flips a restaurant applicant's account active.
        create_sub users-service restaurant-events
        for t in order-events user-events user-contact-events restaurant-events; do
          create_sub admin-service "$$t"; done

  # -----------------------------------------------------------------------
  # 4. Databases and migrations. One Cloud SQL instance, one database per
  #    service — a foreign key still cannot cross between them, which is the
  #    isolation that matters, at a fraction of seven instances' cost. Worth
  #    stating plainly: they do share a failure domain. Splitting the busiest
  #    onto its own instance is the next step when load justifies it.
  # -----------------------------------------------------------------------
  - id: create-databases
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        INSTANCE="$${_CLOUDSQL_INSTANCE##*:}"
        for svc in users restaurants orders payments delivery notifications admin; do
          gcloud sql databases create "$${svc}_db" --instance="$$INSTANCE" --quiet 2>/dev/null || true
        done
    env:
      - "_CLOUDSQL_INSTANCE=${_CLOUDSQL_INSTANCE}"

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: ["build-services", "create-databases"]
    args:
      - -c
      - |
        set -e
        for svc in users restaurants orders payments delivery notifications admin; do
          # `tr`, not bash's ${svc^^}: that is a bash 4 feature, and a shell
          # without it leaves the name unexpanded, which gcloud rejects as an
          # invalid secret — a usage error, not a migration failure, so the log
          # says nothing about migrations at all.
          upper=$$(printf '%s' "$$svc" | tr '[:lower:]' '[:upper:]')
          echo "== migrating $$svc (secret $${upper}_DATABASE_URL)"
          # The job is replaced on every deploy so it always runs the image
          # being deployed — a migration from an older image is how a schema
          # ends up behind the code that needs it.
          gcloud run jobs deploy "$$svc-migrate" \
            --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/$$svc:${_TAG}" \
            --region="${_REGION}" \
            --set-cloudsql-instances="${_CLOUDSQL_INSTANCE}" \
            --set-secrets="DATABASE_URL=$${upper}_DATABASE_URL:latest" \
            --command=alembic --args=upgrade,head \
            --max-retries=1 --quiet
          # --wait, so a failed migration fails the build instead of letting a
          # service deploy against a schema that was never applied.
          gcloud run jobs execute "$$svc-migrate" --region="${_REGION}" --wait --quiet
        done

  # -----------------------------------------------------------------------
  # 5. Deploy the services.
  #
  # Two flags below look contradictory and are not, so they are worth spelling
  # out — getting them wrong is how the gateway ends up 403ing on every request.
  #
  # --ingress=internal-and-cloud-load-balancing is the network door: nothing
  # from the public internet reaches these, only traffic arriving through the
  # VPC. That is what the gateway's --vpc-egress=all-traffic (step 6) buys — and
  # what any service calling another service needs too, which is why egress is
  # decided per service below rather than fixed for all of them.
  #
  # --allow-unauthenticated is the *IAM* door, and opening it is deliberate.
  # Cloud Run's IAM check wants a Google identity token in the Authorization
  # header — the same header that already carries the end user's JWT, which is
  # what these services actually authorise against (shared/identity.py). Only one
  # token fits, and the app's is the one that knows who the customer is. So
  # authorisation happens in the application, and the network door is what keeps
  # strangers out.
  #
  # Belt-and-braces alternative, if you want IAM as well: put the services behind
  # an external Load Balancer with serverless NEGs and let it do the identity
  # token. It is more moving parts for a second lock on a door that is already
  # unreachable.
  # -----------------------------------------------------------------------
  - id: deploy-services
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: ["migrate", "provision-pubsub", "test"]
    args:
      - -c
      - |
        set -e

        # Shared by every service. ^;^ switches gcloud's separator between env
        # vars to ";" so a value may itself contain a comma — CORS_ORIGINS has
        # to, because Cloud Run serves each service on two hostnames and Origin
        # matching is byte-exact.
        #
        # ";" and not "@": the separator was "@" until ADMIN_ALERT_EMAIL arrived
        # and split on the "@" in the address itself. Nothing that belongs here
        # can contain a semicolon — not a URL, an address, an API key or a
        # bucket name — which is more than could ever be said for "@".
        #
        # CORS_ORIGINS is in the shared set, not on users alone. nginx forwards a
        # response untouched, so the browser checks each service's own headers
        # against the SPA's origin — a service without it fails every preflight,
        # which is what happened to everything except sign-in.
        common="ENVIRONMENT=production;MESSAGING_TRANSPORT=pubsub;GOOGLE_CLOUD_PROJECT=${PROJECT_ID};CORS_ORIGINS=${_FE_URL}"

        # CORS_ORIGINS wants every hostname the browser might send as Origin, so
        # it takes _FE_URL whole. FRONTEND_BASE_URL is the opposite: it is
        # concatenated into a single link — the password-reset URL in users, the
        # Stripe return URL in payments — and a comma-joined pair there produces
        # "https://a,https://b/reset-password?token=…", which is not a URL at all.
        # So it gets the first element only. The assignment is split in two
        # because ${_FE_URL} is a Cloud Build substitution and %%,* is bash: the
        # substitution has to land in a shell variable before bash can trim it.
        fe_all="${_FE_URL}"
        fe_primary="$${fe_all%%,*}"

        # Egress is per-service, and the difference is not cosmetic.
        #
        # A Cloud Run URL is a *public* address. Under private-ranges-only a call
        # from one service to another therefore leaves the VPC, and arrives at an
        # --ingress=internal-and-cloud-load-balancing service as public traffic.
        # Cloud Run answers that with 404 — not 403 — and a 404 at the call site
        # is indistinguishable from the resource genuinely not being there. That
        # is how a network setting came out as "Menu item with ID 1 not found":
        # orders could not reach restaurants at all, and said the dish did not
        # exist. The 404 is now logged with its body (shared/http_client.py), but
        # the setting is the fix.
        #
        # So the services holding another service's URL — the two with a
        # *_SERVICE_URL below — get all-traffic, the same thing the gateway gets
        # in step 6 and for the same reason. The rest keep private-ranges-only:
        # they only ever talk to Cloud SQL, Redis and Google APIs, and routing
        # that through the connector buys nothing.
        #
        # all-traffic sends Google API traffic through the VPC too, so the
        # connector's subnet needs Private Google Access on — without it Pub/Sub
        # and Secret Manager stop resolving for these two.
        egress() {
          case "$$1" in
            orders|admin) echo all-traffic ;;
            *) echo private-ranges-only ;;
          esac
        }

        deploy() {
          local svc="$$1"; shift
          gcloud run deploy "$$svc-service" \
            --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/$$svc:${_TAG}" \
            --region="${_REGION}" --platform=managed \
            --ingress=internal-and-cloud-load-balancing \
            --allow-unauthenticated \
            --add-cloudsql-instances="${_CLOUDSQL_INSTANCE}" \
            --vpc-connector="${_VPC_CONNECTOR}" --vpc-egress="$$(egress "$$svc")" \
            --min-instances=1 --no-cpu-throttling \
            "$$@" --quiet
        }

        # min-instances=1 above is not a performance tweak: every service runs a
        # Pub/Sub subscriber in a background thread, and Cloud Run stops
        # background work on an idle instance. Scaled to zero, a service stops
        # consuming and its read-models silently stop updating.
        #
        # --no-cpu-throttling is the other half of the same requirement, and
        # min-instances alone does not give it. An instance kept alive but
        # throttled between requests has no CPU for that subscriber thread, so
        # the handler cannot finish inside its 30s future timeout: admin-service
        # alone failed 1,285 Pub/Sub messages that way, and notifications took
        # 43 seconds after boot to subscribe at all. The instance was up the
        # whole time — it just was not allowed to run.

        # Mount a secret only if it exists.
        #
        # Third-party integrations are optional in the code — Twilio, SendGrid
        # and the Stripe webhook secret are all `Optional[str] = None`, and the
        # feature degrades to log-only rather than failing. Mounting them
        # unconditionally threw that away: a project that never configured
        # Twilio got "Permission denied on secret ... TWILIO_ACCOUNT_SID" and
        # the whole revision refused to start, for an integration it was not
        # trying to use. The message names permissions, which sends you looking
        # at IAM for a secret that simply is not there.
        #
        # Required secrets are NOT passed through here. A missing DATABASE_URL
        # or JWT_SECRET_KEY must fail the deploy loudly — silently starting a
        # service with no signing key is far worse than not starting.
        optional_secrets() {
          local out="" pair env name
          for pair in "$$@"; do
            env="$${pair%%=*}"; name="$${pair#*=}"
            if gcloud secrets describe "$$name" --project="${PROJECT_ID}" >/dev/null 2>&1; then
              out="$${out:+$$out,}$${env}=$${name}:latest"
            else
              # stderr, not stdout: this function's stdout IS the secrets list,
              # and a note printed to it lands inside the --set-secrets value.
              echo "  note: secret $$name not found — $$env left unset, its feature stays off" >&2
            fi
          done
          printf '%s' "$$out"
        }

        # Joins the required list with whatever optional_secrets found, without
        # leaving a dangling comma when it found nothing.
        with_optional() {
          local required="$$1"; shift
          local extra; extra="$$(optional_secrets "$$@")"
          printf '%s' "$${required}$${extra:+,$$extra}"
        }

        # ADMIN_GATE_PASSWORD is required, not optional, and deliberately so: the
        # users service refuses to start in production without it (see its
        # config.py), because a silently absent gate is a console with nothing in
        # front of its login form. Listing it here makes a missing secret a
        # failed deploy rather than a revision that crash-loops on startup.
        #
        # BOOTSTRAP_SECRET is optional in the opposite direction. Absent, the
        # first-admin route disables itself, which is the correct state for every
        # deployment that has already been bootstrapped — that is, all of them
        # after the first day.
        deploy users \
          --set-env-vars="^;^$$common;FRONTEND_BASE_URL=$$fe_primary" \
          --set-secrets="$$(with_optional \
            "DATABASE_URL=USERS_DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,ADMIN_GATE_PASSWORD=ADMIN_GATE_PASSWORD:latest" \
            GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY \
            BOOTSTRAP_SECRET=BOOTSTRAP_SECRET)"

        deploy restaurants \
          --set-env-vars="^;^$$common;GCS_BUCKET_NAME=${_GCS_BUCKET_NAME};ADMIN_ALERT_EMAIL=${_ADMIN_ALERT_EMAIL}" \
          --set-secrets="$$(with_optional \
            "DATABASE_URL=RESTAURANTS_DATABASE_URL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest" \
            GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY)"

        deploy orders \
          --set-env-vars="^;^$$common;RESTAURANTS_SERVICE_URL=${_RESTAURANTS_URL}" \
          --set-secrets="DATABASE_URL=ORDERS_DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest"

        # Stripe keys go to payments and nowhere else. In the monolith every
        # module shared one process and therefore one set of credentials; the
        # split is the first time that stops being true, and it is worth keeping.
        # STRIPE_* are optional: without them the deterministic stand-in provider
        # takes over, which is a working service rather than a broken one. Worth
        # knowing which half you lose — without the webhook secret no webhook can
        # be verified, so none is trusted and card orders never settle from
        # Stripe's callback.
        deploy payments \
          --set-env-vars="^;^$$common;FRONTEND_BASE_URL=$$fe_primary" \
          --set-secrets="$$(with_optional \
            "DATABASE_URL=PAYMENTS_DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest" \
            STRIPE_SECRET_KEY=STRIPE_SECRET_KEY \
            STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET)"

        deploy delivery \
          --set-env-vars="^;^$$common" \
          --set-secrets="$$(with_optional \
            "DATABASE_URL=DELIVERY_DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest" \
            GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY)"

        # SENDGRID_* are what turn transactional email from log-only into real
        # delivery. Both are required together: EmailSender tests `key and
        # sender`, so mounting one without the other silently keeps the log
        # transport and nobody notices until a customer asks where their receipt
        # is.
        deploy notifications \
          --set-env-vars="^;^$$common" \
          --set-secrets="$$(with_optional \
            "DATABASE_URL=NOTIFICATIONS_DATABASE_URL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest" \
            SENDGRID_API_KEY=SENDGRID_API_KEY \
            SENDGRID_FROM_EMAIL=SENDGRID_FROM_EMAIL \
            TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID \
            TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN \
            TWILIO_PHONE_NUMBER=TWILIO_PHONE_NUMBER)"

        # The same BOOTSTRAP_SECRET the users service holds — this one forwards
        # it as X-Bootstrap-Secret, users compares it. Optional here for the same
        # reason: without it this service refuses the call rather than opening it.
        deploy admin \
          --set-env-vars="^;^$$common;ORDERS_SERVICE_URL=${_ORDERS_URL};USERS_SERVICE_URL=${_USERS_URL}" \
          --set-secrets="$$(with_optional \
            "DATABASE_URL=ADMIN_DATABASE_URL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest" \
            BOOTSTRAP_SECRET=BOOTSTRAP_SECRET)"

  # -----------------------------------------------------------------------
  # 6. The gateway: the only public door to the API. Its upstreams are the
  #    service URLs, substituted into the nginx config at container start —
  #    see infra/gcp/gateway.Dockerfile.
  #
  #    --vpc-egress=all-traffic is what makes step 5's internal ingress work.
  #    A *.run.app address is a public range, so with private-ranges-only the
  #    gateway's calls would leave over the internet, arrive as external traffic
  #    and be refused by services that only accept internal. Routing all egress
  #    through the connector makes them internal.
  # -----------------------------------------------------------------------
  - id: deploy-gateway
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: ["deploy-services", "build-gateway"]
    args:
      - run
      - deploy
      - api-gateway
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/gateway:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=all-traffic
      - --set-env-vars=^;^USERS_URL=${_USERS_URL};RESTAURANTS_URL=${_RESTAURANTS_URL};ORDERS_URL=${_ORDERS_URL};PAYMENTS_URL=${_PAYMENTS_URL};DELIVERY_URL=${_DELIVERY_URL};NOTIFICATIONS_URL=${_NOTIFICATIONS_URL};ADMIN_URL=${_ADMIN_URL}
      - --quiet

  # -----------------------------------------------------------------------
  # 7. The frontend. Static SPA served by nginx; the gateway URL was baked in
  #    at build time, which is why a changed _GATEWAY_URL needs a rebuild and
  #    not just a redeploy.
  # -----------------------------------------------------------------------
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: ["build-frontend", "deploy-gateway"]
    args:
      - run
      - deploy
      - food-frontend
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/frontend:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --quiet

timeout: 3600s
