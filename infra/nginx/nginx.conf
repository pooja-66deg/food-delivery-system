# API gateway.
#
# One public origin in front of seven services, so the frontend keeps calling the
# same paths it always did and does not know the platform was split.
#
# ---------------------------------------------------------------------------
# Two nginx behaviours shape every block below, and both are easy to get wrong.
#
# **Upstreams are resolved once unless you force otherwise.** nginx resolves a
# literal upstream hostname at config load and caches the address for the life of
# the process. Recreate a service container — `compose up -d --build
# orders-service` — and it comes back on a different IP that Docker may already
# have handed to a *different* service. The gateway then routes to the wrong
# container and you get a puzzling 404 rather than a connection error. Putting the
# upstream in a variable is the only form nginx re-resolves per request.
#
# **A variable in proxy_pass turns off prefix stripping.** With a literal
# `proxy_pass http://x/orders/`, nginx replaces the matched location prefix
# automatically. With a variable it does not — the original URI is passed
# through — so each block rewrites the path explicitly. Getting this wrong is
# what makes /api/auth/register arrive as /api/auth/register and 404.
#
# The two together are why every block looks the same: set, rewrite, proxy_pass —
# and the order is not cosmetic. `rewrite ... break` halts the rewrite module for
# the block, and `set` belongs to that module, so a `set` after the rewrite never
# runs. nginx then warns about an uninitialised variable and returns 500.
# ---------------------------------------------------------------------------
#
# The routing rule that matters: each service keeps the prefix it already served
# — /api/orders/… becomes /orders/…, not /… . A router that has to be rewritten
# to move is a router that cannot move back.
#
# Auth is deliberately not done here. Each service verifies the JWT itself
# against the shared secret (see shared/identity.py): a gateway that validated
# tokens would be a synchronous dependency in front of everything, and one that
# stripped the Authorization header would leave services unable to authorise at
# all. The header is forwarded untouched.

server {
    listen 8080;
    server_name _;

    # Generous enough for checkout's call chain, short enough that a hung
    # service surfaces as an error rather than a browser spinning forever.
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Docker's embedded DNS, for the per-request resolution described above.
    resolver 127.0.0.11 valid=10s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;

    # CORS is deliberately NOT done here. Each service installs Starlette's
    # CORSMiddleware against its own allowlist (shared/cors.py), and this file
    # forwarding the request untouched is what lets that allowlist be the only
    # thing deciding.
    #
    # What used to be here was `add_header Access-Control-Allow-Origin
    # $http_origin` alongside `Allow-Credentials: true`, plus a blanket
    # `if ($request_method = OPTIONS) { return 204; }`. Those two together are
    # the exact shape CORS exists to prevent: reflecting the requesting origin
    # means *every* origin is allowed, and allowing credentials with it lets any
    # site on the internet make authenticated calls with a signed-in visitor's
    # cookies and read the replies. The blanket 204 made it worse by answering
    # preflights before the services' allowlist ever saw them — so the check that
    # would have refused was skipped precisely when it mattered.
    #
    # The deployed Cloud Run gateway (nginx.conf.template) never had this, which
    # is why production was unaffected and only this compose file was at risk.

    # The gateway's own liveness, answered here rather than proxied. Asking a
    # service whether the gateway is up conflates two different outages.
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }

    # ---- users service: identity, profile, addresses, favourites ----------
    location /api/auth/ {
        set $users http://users-service:8000;
        rewrite ^/api(/auth/.*)$ $1 break;
        proxy_pass $users;
    }

    location /api/users/ {
        set $users http://users-service:8000;
        rewrite ^/api(/users/.*)$ $1 break;
        proxy_pass $users;
    }

    # Matches /api/favorites as well as /api/favorites/ids and /api/favorites/7.
    location /api/favorites {
        set $users http://users-service:8000;
        rewrite ^/api(/favorites.*)$ $1 break;
        proxy_pass $users;
    }

    # ---- restaurants service: catalogue, menu, stock, reviews -------------
    location /api/restaurants {
        set $restaurants http://restaurants-service:8000;
        rewrite ^/api(/restaurants.*)$ $1 break;
        proxy_pass $restaurants;
    }

    location /api/reviews {
        set $restaurants http://restaurants-service:8000;
        rewrite ^/api(/reviews.*)$ $1 break;
        proxy_pass $restaurants;
    }

    # Uploaded images are written by the restaurants service, so they are served
    # by it too. In production these are GCS URLs and never reach the gateway.
    location /media/ {
        set $restaurants http://restaurants-service:8000;
        proxy_pass $restaurants$request_uri;
    }

    # ---- orders service: orders and the cart -----------------------------
    location /api/orders {
        set $orders http://orders-service:8000;
        rewrite ^/api(/orders.*)$ $1 break;
        proxy_pass $orders;
    }

    location /api/cart {
        set $orders http://orders-service:8000;
        rewrite ^/api(/cart.*)$ $1 break;
        proxy_pass $orders;
    }

    # ---- payments service ------------------------------------------------
    #
    # The webhook is public by design: Stripe has no token to present, and the
    # HMAC over the raw body is what authenticates it.
    location /api/payments {
        set $payments http://payments-service:8000;
        rewrite ^/api(/payments.*)$ $1 break;
        proxy_pass $payments;
    }

    # ---- delivery service ------------------------------------------------
    location /api/delivery/ {
        set $delivery http://delivery-service:8000;
        rewrite ^/api(/delivery/.*)$ $1 break;
        proxy_pass $delivery;
    }

    # ---- notifications service -------------------------------------------
    location /api/notifications {
        set $notifications http://notifications-service:8000;
        rewrite ^/api(/notifications.*)$ $1 break;
        proxy_pass $notifications;
    }

    # ---- admin service ---------------------------------------------------
    location /api/admin/ {
        set $admin http://admin-service:8000;
        rewrite ^/api(/admin/.*)$ $1 break;
        proxy_pass $admin;
    }

    # Anything else is a route that does not exist, and saying so is better than
    # quietly forwarding it somewhere that will answer confusingly.
    location / {
        return 404;
    }
}
