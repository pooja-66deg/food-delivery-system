# API Gateway for microservices architecture
# Routes incoming requests to individual service endpoints

upstream orders_service {
    server orders-service:8000;
}

upstream payments_service {
    server payments-service:8000;
}

upstream users_service {
    server users-service:8000;
}

upstream restaurants_service {
    server restaurants-service:8000;
}

upstream delivery_service {
    server delivery-service:8000;
}

upstream notifications_service {
    server notifications-service:8000;
}

upstream admin_service {
    server admin-service:8000;
}

# Health check service upstream (can be any service)
upstream health_check {
    server orders-service:8000;
}

server {
    listen 8080;
    server_name _;

    # Set timeout values for microservice calls
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://health_check/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Orders service routes
    location /api/orders/ {
        client_max_body_size 6m;
        proxy_pass http://orders_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payments service routes
    location /api/payments/ {
        client_max_body_size 6m;
        proxy_pass http://payments_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Users service routes
    location /api/users/ {
        client_max_body_size 6m;
        proxy_pass http://users_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Restaurants service routes
    location /api/restaurants/ {
        client_max_body_size 6m;
        proxy_pass http://restaurants_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Delivery service routes
    location /api/delivery/ {
        client_max_body_size 6m;
        proxy_pass http://delivery_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Notifications service routes
    location /api/notifications/ {
        client_max_body_size 6m;
        proxy_pass http://notifications_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin service routes
    location /api/admin/ {
        client_max_body_size 6m;
        proxy_pass http://admin_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catch-all for undefined routes
    location / {
        return 404;
    }
}
