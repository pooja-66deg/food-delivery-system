# Local development stack.
#
# This file lives under infra/, so every host path below is relative to
# infra/compose/ — "../.." is the repository root. Run it from anywhere with:
#   docker compose -f infra/compose/docker-compose.yml up --build
# or let run.sh do it for you.
#
# The project name is pinned rather than derived. Compose would otherwise name
# the project after this file's directory ("compose"), which would rename the
# volumes and strand the Postgres data anyone already has from when this file
# sat in the repository root.
name: food-delivery-system

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fooddelivery_postgres
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: fooddelivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d fooddelivery"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fooddelivery_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper - required for Kafka broker coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fooddelivery_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka - event streaming for microservices
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fooddelivery_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservices PostgreSQL databases
  # Each service gets its own database and schema for data isolation

  postgres-orders:
    image: postgres:15-alpine
    container_name: fooddelivery_postgres_orders
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: orders_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-payments:
    image: postgres:15-alpine
    container_name: fooddelivery_postgres_payments
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: payments_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_payments_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d payments_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-users:
    image: postgres:15-alpine
    container_name: fooddelivery_postgres_users
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: users_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d users_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-restaurants:
    image: postgres:15-alpine
    container_name: fooddelivery_postgres_restaurants
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: restaurants_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_restaurants_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d restaurants_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-delivery:
    image: postgres:15-alpine
    container_name: fooddelivery_postgres_delivery
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: delivery_db
    ports:
      - "5437:5432"
    volumes:
      - postgres_delivery_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d delivery_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notifications:
    image: postgres:15-alpine
    container_name: fooddelivery_postgres_notifications
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: notifications_db
    ports:
      - "5438:5432"
    volumes:
      - postgres_notifications_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d notifications_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service (Monolith - kept for backward compatibility)
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: fooddelivery_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Third-party credentials (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, Twilio,
    # SendGrid, Google Maps) come from the repo-root .env. Optional: without it
    # each integration falls back to its stand-in. The environment: block below
    # wins over anything here, so a host .env cannot redirect the container at
    # a localhost database.
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql://fooduser:foodpass@postgres:5432/fooddelivery
      REDIS_URL: redis://redis:6379/0
      # .env.example ships DATABASE_ECHO=true for someone running uvicorn by
      # hand; echoing every statement into the container log is not what anyone
      # wants from `compose up`. Pinned here so the env_file cannot turn it on.
      DATABASE_ECHO: "false"
      # Kafka disabled for now (see note above); the app tolerates its absence.
      KAFKA_BROKERS: disabled:9092
      JWT_SECRET_KEY: dev-secret-change-me
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ../../src:/app/src
      - ../../alembic:/app/alembic
      - ../../alembic.ini:/app/alembic.ini
    # Apply DB migrations before serving (schema is no longer created at runtime).
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"

  # Customer Web App (built + served by nginx, proxies /api to the backend)
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      # Vite inlines this at build time, so it has to arrive as a build arg — a
      # runtime environment: block would be too late. It is a public key that
      # ships in the bundle. Unset on the host = empty = the map degrades to a
      # text panel. Card payments need no browser-side key at all.
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    env_file:
      - path: ../../.env
        required: false
    container_name: fooddelivery_frontend
    depends_on:
      - api
    ports:
      - "5173:80"

  # API Gateway - routes requests to individual microservices
  api-gateway:
    image: nginx:alpine
    container_name: fooddelivery_api_gateway
    ports:
      - "8080:8080"
    volumes:
      - ../../infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orders-service
      - payments-service
      - users-service
      - restaurants-service
      - delivery-service
      - notifications-service
      - admin-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Orders Microservice (placeholder - implementation in Task 3+)
  orders-service:
    image: python:3.11-slim
    container_name: fooddelivery_orders_service
    depends_on:
      postgres-orders:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fooduser:foodpass@postgres-orders:5432/orders_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-secret-change-me
      ENVIRONMENT: development
      SERVICE_NAME: orders-service
    ports:
      - "8001:8000"
    command: echo "Orders service placeholder - implementation in Task 3+"
    healthcheck:
      test: ["CMD", "python", "-c", "print('healthy')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Payments Microservice (placeholder - implementation in Task 3+)
  payments-service:
    image: python:3.11-slim
    container_name: fooddelivery_payments_service
    depends_on:
      postgres-payments:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
