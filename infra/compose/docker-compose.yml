name: food-delivery-system

services:
  redis:
    image: redis:7-alpine
    container_name: fooddelivery_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper - required for Kafka broker coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fooddelivery_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka - event streaming for microservices
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fooddelivery_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservices PostgreSQL databases
  # Each service gets its own database and schema for data isolation

  postgres-orders:
    image: postgres:15-alpine
    container_name: fooddelivery_postgres_orders
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: orders_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-payments:
    image: postgres:15-alpine
    container_name: fooddelivery_postgres_payments
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: payments_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_payments_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d payments_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-users:
    image: postgres:15-alpine
    container_name: fooddelivery_postgres_users
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: users_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d users_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-restaurants:
    image: postgres:15-alpine
    container_name: fooddelivery_postgres_restaurants
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: restaurants_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_restaurants_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d restaurants_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-delivery:
    image: postgres:15-alpine
    container_name: fooddelivery_postgres_delivery
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: delivery_db
    ports:
      - "5437:5432"
    volumes:
      - postgres_delivery_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d delivery_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notifications:
    image: postgres:15-alpine
    container_name: fooddelivery_postgres_notifications
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: notifications_db
    ports:
      - "5438:5432"
    volumes:
      - postgres_notifications_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d notifications_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-admin:
    image: postgres:15-alpine
    container_name: fooddelivery_postgres_admin
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: admin_db
    ports:
      - "5439:5432"
    volumes:
      - postgres_admin_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d admin_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  # Customer Web App (built + served by nginx, proxies /api to the gateway)
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      # Vite inlines this at build time, so it has to arrive as a build arg — a
      # runtime environment: block would be too late. It is a public key that
      # ships in the bundle. Unset on the host = empty = the map degrades to a
      # text panel. Card payments need no browser-side key at all.
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    env_file:
      - path: ../../.env
        required: false
    container_name: fooddelivery_frontend
    depends_on:
      # The gateway, not the monolith: the frontend's nginx proxies /api to it.
      - api-gateway
    ports:
      - "5173:80"

  # API Gateway - routes requests to individual microservices
  api-gateway:
    image: nginx:alpine
    container_name: fooddelivery_api_gateway
    ports:
      - "8080:8080"
    volumes:
      - ../../infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orders-service
      - payments-service
      - users-service
      - restaurants-service
      - delivery-service
      - notifications-service
      - admin-service
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to
      # ::1 first, and nginx's `listen 8080` binds IPv4 only — so the probe was
      # refused while the gateway was serving perfectly well from outside.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Orders Microservice — extracted from the monolith.
  #
  # The one service that calls another synchronously: checkout asks restaurants
  # to validate and reserve, because the customer is waiting for the answer.
  # Guarded by a timeout and a circuit breaker — see shared/http_client.py.
  orders-service:
    build:
      context: ../..
      dockerfile: services/orders/Dockerfile
    container_name: fooddelivery_orders_service
    depends_on:
      postgres-orders:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fooduser:foodpass@postgres-orders:5432/orders_db
      DATABASE_ECHO: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: orders-service
      KAFKA_TOPICS: payment-events,delivery-events,address-events,restaurant-events,user-events
      REDIS_URL: redis://redis:6379/0
      RESTAURANTS_SERVICE_URL: http://restaurants-service:8000
      JWT_SECRET_KEY: dev-secret-change-me
      ENVIRONMENT: development
      SERVICE_NAME: orders-service
    ports:
      - "8001:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Payments Microservice — extracted from the monolith.
  payments-service:
    build:
      # Repo root, so the image can copy the shared package alongside the service.
      context: ../..
      dockerfile: services/payments/Dockerfile
    container_name: fooddelivery_payments_service
    depends_on:
      postgres-payments:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Stripe keys come from the repo-root .env. Without them the deterministic
    # stand-in provider takes over, which is a working service in dev.
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://fooduser:foodpass@postgres-payments:5432/payments_db
      # .env.example ships DATABASE_ECHO=true for someone running uvicorn by
      # hand. This service reads that same .env for its Stripe keys, so pin it
      # here or every statement lands in the container log.
      DATABASE_ECHO: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: payments-service
      KAFKA_TOPICS: order-events,payment-commands
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-secret-change-me
      ENVIRONMENT: development
      SERVICE_NAME: payments-service
    ports:
      - "8002:8000"
    # Migrations as a start step: the service owns its schema, so it applies it.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Users Microservice — extracted from the monolith.
  users-service:
    build:
      # Repo root, so the image can copy the shared package alongside the service.
      context: ../..
      dockerfile: services/users/Dockerfile
    container_name: fooddelivery_users_service
    depends_on:
      postgres-users:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fooduser:foodpass@postgres-users:5432/users_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: users-service
      # The one topic this service consumes: an operator's approval decision is
      # what turns a pending restaurant applicant's account active.
      KAFKA_TOPICS: restaurant-events
      REDIS_URL: redis://redis:6379/0
      # Only the signing secret — not another service's database. Tokens are
      # verified locally, so this service does not go down when users does.
      JWT_SECRET_KEY: dev-secret-change-me
      ENVIRONMENT: development
      SERVICE_NAME: users-service
    ports:
      - "8003:8000"
    # Migrations as a start step: the service owns its schema, so it applies it.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # /health, not /ready: this asks whether the process is alive. A database
      # blip must not make the orchestrator restart a healthy process.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Restaurants Microservice — extracted from the monolith.
  restaurants-service:
    build:
      # Repo root, so the image can copy the shared package alongside the service.
      context: ../..
      dockerfile: services/restaurants/Dockerfile
    container_name: fooddelivery_restaurants_service
    depends_on:
      postgres-restaurants:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fooduser:foodpass@postgres-restaurants:5432/restaurants_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: restaurants-service
      KAFKA_TOPICS: order-events,user-events,restaurant-registrations
      # Where "a restaurant is waiting for approval" is mailed. Unset in compose:
      # the log-only sender would print it anyway, and the admin console lists
      # everything pending. Set it to see the alert take the email path.
      ADMIN_ALERT_EMAIL: ""
      # Only the signing secret — not another service's database. Tokens are
      # verified locally, so this service does not go down when users does.
      JWT_SECRET_KEY: dev-secret-change-me
      ENVIRONMENT: development
      SERVICE_NAME: restaurants-service
    ports:
      - "8004:8000"
    # Migrations as a start step: the service owns its schema, so it applies it.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # /health, not /ready: this asks whether the process is alive. A database
      # blip must not make the orchestrator restart a healthy process.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Delivery Microservice — extracted from the monolith.
  delivery-service:
    build:
      # Repo root, so the image can copy the shared package alongside the service.
      context: ../..
      dockerfile: services/delivery/Dockerfile
    container_name: fooddelivery_delivery_service
    depends_on:
      postgres-delivery:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fooduser:foodpass@postgres-delivery:5432/delivery_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: delivery-service
      KAFKA_TOPICS: order-events,user-events
      REDIS_URL: redis://redis:6379/0
      # Only the signing secret — not another service's database. Tokens are
      # verified locally, so this service does not go down when users does.
      JWT_SECRET_KEY: dev-secret-change-me
      ENVIRONMENT: development
      SERVICE_NAME: delivery-service
    ports:
      - "8005:8000"
    # Migrations as a start step: the service owns its schema, so it applies it.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # /health, not /ready: this asks whether the process is alive. A database
      # blip must not make the orchestrator restart a healthy process.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Notifications Microservice — the first real one.
  #
  # Nothing calls it synchronously; it only consumes order events. Stop it and
  # orders keep succeeding, with the events waiting in Kafka until it returns.
  # That is the property the whole split exists for, and it is testable here:
  #
  #   docker compose stop notifications-service   # place an order: still works
  #   docker compose start notifications-service  # the backlog is delivered
  notifications-service:
    build:
      # Repo root, so the image can copy the shared package alongside the service.
      context: ../..
      dockerfile: services/notifications/Dockerfile
    container_name: fooddelivery_notifications_service
    depends_on:
      postgres-notifications:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fooduser:foodpass@postgres-notifications:5432/notifications_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: notifications-service
      KAFKA_TOPICS: order-events,notification-events,user-contact-events,restaurant-events
      # Only the signing secret — not the users database. Tokens are verified
      # locally, so this service does not go down when users-service does.
      JWT_SECRET_KEY: dev-secret-change-me
      ENVIRONMENT: development
      SERVICE_NAME: notifications-service
    ports:
      - "8006:8000"
    # Migrations as a start step: the service owns its schema, so it applies it.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # /health, not /ready: this asks whether the process is alive. A database
      # blip must not make the orchestrator restart a healthy process.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Admin Microservice — the operator console.
  #
  # The only service that reads across the whole platform, and it does it from
  # local copies rather than by calling everyone: a console that fans out is
  # down whenever any one service is. The cost is that a number may lag a second
  # or two, which for reporting is the right trade.
  admin-service:
    build:
      context: ../..
      dockerfile: services/admin/Dockerfile
    container_name: fooddelivery_admin_service
    depends_on:
      postgres-admin:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fooduser:foodpass@postgres-admin:5432/admin_db
      DATABASE_ECHO: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: admin-service
      KAFKA_TOPICS: order-events,user-events,user-contact-events,restaurant-events
      ORDERS_SERVICE_URL: http://orders-service:8000
      JWT_SECRET_KEY: dev-secret-change-me
      ENVIRONMENT: development
      SERVICE_NAME: admin-service
    ports:
      - "8007:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  redis_data:
  postgres_orders_data:
  postgres_payments_data:
  postgres_users_data:
  postgres_restaurants_data:
  postgres_delivery_data:
  postgres_admin_data:
  postgres_notifications_data:
