server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA; unknown paths fall back to index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the API gateway, which fans them out to the
    # services. Was http://api:8000/ — the monolith — until the split.
    # The prefix is *kept* here — the gateway routes on /api/... itself — so
    # /api/auth/login reaches the gateway as /api/auth/login and is forwarded
    # to the users service as /auth/login.
    location /api/ {
        # Image uploads cap at 5 MB in the app (see restaurants/storage.py).
        # nginx defaults to 1 MB and would 413 first; leave headroom for
        # multipart boundary overhead so the app's own message is what users get.
        client_max_body_size 6m;

        proxy_pass http://api-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded images. Served by the restaurants service in development; in
    # production these are absolute GCS URLs and never come through here.
    location /media/ {
        proxy_pass http://api-gateway:8080/media/;
        proxy_set_header Host $host;
    }
}
