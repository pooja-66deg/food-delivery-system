[pytest]
# Shared by every service's suite, but each runs in its own process with its own
# PYTHONPATH — see services/test.sh for why.
#
# No `pythonpath` here on purpose: the runner sets it per service, because the
# whole point is that one service's `app` must never be visible to another's.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --import-mode=importlib
