[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "food-delivery-system"
version = "0.1.0"
description = "Food Delivery System — modular monolith with service-ready domain boundaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "pydantic[email]==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "greenlet==3.1.1",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "redis==5.2.1",
    "PyJWT==2.10.1",
    "bcrypt==4.2.1",
    "kafka-python-ng==2.2.3",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    # payments/providers.py imports this lazily inside a try, so a missing install
    # surfaces only as a swallowed ImportError at charge time — the card form
    # submits and silently fails. Declared here so StripeProvider actually works
    # once STRIPE_SECRET_KEY is set.
    "stripe==15.4.0",
    # EmailSender imports this lazily, so a missing install shows up only as a
    # swallowed ImportError at send time — not at startup. Declared here so the
    # real transport actually engages once SENDGRID_* are configured.
    "sendgrid==6.12.5",
    # Same lazy-import shape in payments/providers.py: without this declared,
    # StripeProvider fails at charge time with a swallowed ImportError while the
    # checkout still looks healthy.
    "stripe==15.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "testcontainers==4.9.0",
    "aiosqlite==0.20.0",
    "fakeredis==2.26.2",
    "requests==2.32.3",
    "black==24.10.0",
    "flake8==7.1.1",
    "mypy==1.14.1",
]

monitor = [
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-prometheus==0.50b0",
    "prometheus-client==0.21.1",
]
