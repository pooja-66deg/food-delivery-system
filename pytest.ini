[pytest]
# The code imports itself as "src.…", which only resolves when the repo root is
# on sys.path. An editable install doesn't provide it — setuptools reads the
# layout as src-layout and installs src/'s *contents* (core, modules, main…) as
# top-level modules, so "src" itself is never importable. --import-mode=importlib
# also stops pytest inserting the rootdir itself, so state it explicitly; this is
# the same thing alembic.ini does with prepend_sys_path.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=src --cov-report=html --cov-report=term-missing -v --import-mode=importlib
markers =
    integration: tests that require real infrastructure (Postgres via Testcontainers); skipped when Docker is unavailable.
