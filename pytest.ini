[pytest]
# The shared package's own tests, sitting inside it — the same shape every
# service uses (services/<name>/tests). One convention, no root-level tests
# folder wondering what it belongs to.
#
# Each service's tests run in their own process instead, because they all have a
# package named `app` and one pytest run would import one of them and serve it
# to the rest: ./services/test.sh.
#
# `pythonpath = .` puts the repo root on sys.path so `shared` imports the same
# way here as it does inside a service image, where the Dockerfile copies it to
# /app/shared. --import-mode=importlib stops pytest inserting the rootdir itself,
# so it is stated explicitly.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = shared/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=shared --cov-report=html --cov-report=term-missing -v --import-mode=importlib
